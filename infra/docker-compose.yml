name: shopia

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shopia-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopia}
      POSTGRES_DB: ${POSTGRES_DB:-shopia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shopia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopia} -d ${POSTGRES_DB:-shopia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shopia-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_VERSION: ${APP_VERSION:-v001-a}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopia}:${POSTGRES_PASSWORD:-shopia}@db:5432/${POSTGRES_DB:-shopia}
      # Por defecto apunta al Ollama nativo del host (ideal en Mac Apple Silicon y Windows con Ollama local).
      # Si activas el perfil "nvidia", cambia OLLAMA_BASE_URL=http://ollama:11434 en infra/.env
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@shopia.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Perfil opcional para Windows (WSL2 + Docker Desktop + NVIDIA Container Toolkit)
  ollama:
    image: ollama/ollama:latest
    container_name: shopia-ollama
    profiles: ["nvidia"]
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - shopia_ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Perfil opcional para exponer el backend mediante Tailscale Funnel desde Docker
  tailscale:
    image: tailscale/tailscale:latest
    container_name: shopia-tailscale
    profiles: ["tailscale"]
    restart: always
    hostname: ${TS_HOSTNAME:-shopia-backend}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

volumes:
  shopia_pgdata:
  shopia_ollama:
